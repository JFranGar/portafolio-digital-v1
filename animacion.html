  // Pantalla brillando suavemente (blancos rotos)
  const screenColor = (s * 10) % 2 < 1 ? '#cbd5e1' : '#e2e8f0';
  R(ctx, 124, FLOOR - 76, 42, 27, screenColor);
  
  drawHero(ctx, 80, FLOOR, 'sit', 1);
  // Simular tecleo con destellos
  if ((s * 10) % 2 < 1) drawSparks(ctx, 120, FLOOR - 35, 0.1, Math.floor(s*10), 2, 0.2);
}

function scene2(ctx, s) {
  drawRoom(ctx);
  // Pantalla de error (Rojo oscuro ladrillo, nada de neón)
  R(ctx, 124, FLOOR - 76, 42, 27, '#991b1b');
  if (s > 0.2 && s < 2.5) drawText(ctx, 'ERROR', 145, FLOOR - 65, '#f8fafc', { scale: 1, align: 'center' });
  
  if (s < 1) { 
    // Sorpresa
    drawHero(ctx, 75, FLOOR, 'sit', 1);
  } else { 
    // Arreglando a toda velocidad
    drawHero(ctx, 80, FLOOR, 'sit', 1);
    if ((s * 20) % 2 < 1) drawSparks(ctx, 120, FLOOR - 35, 0.1, Math.floor(s*20), 3, 0.2);
  }
}

function scene3(ctx, s) {
  drawRoom(ctx);
  // Pantalla de éxito (Verde pino oscuro y suave)
  R(ctx, 124, FLOOR - 76, 42, 27, '#166534');
  if (s > 0.2) drawText(ctx, 'LISTO', 145, FLOOR - 65, '#f8fafc', { scale: 1, align: 'center' });
  
  // Salto de victoria
  const hop = s < 1 ? arc(seg(s, 0, 0.6), 15) : 0;
  drawHero(ctx, 80, FLOOR - hop, s < 1 ? 'jump' : 'celebrate', 1);
  if (s > 0.5) drawSparks(ctx, 80, FLOOR - 40, s - 0.5, 1, 10, 0.8);
}

const SCENES = [
  { name: 'Codigo', start: 0, end: 4, draw: scene1, mood: 'build' },
  { name: 'Error', start: 4, end: 7, draw: scene2, mood: 'tension' },
  { name: 'Victoria', start: 7, end: 10, draw: scene3, mood: 'triumph' },
];
const CUTS = [4, 7];
const SOUND_CUES = [[0.1, 'type'], [1.5, 'type'], [2.8, 'type'], [4, 'alarm'], [5.2, 'type'], [6.1, 'type'], [7, 'powerup'], [7.5, 'bell']];

// =====================================================================================
// 4. PLAYER
// =====================================================================================
function drawScene(ctx, t) {
  t = mod(t, DUR);
  R(ctx, 0, 0, W, H, '#0f172a');
  const sc = SCENES.find(s => t < s.end) || SCENES[SCENES.length - 1];
  ctx.save(); sc.draw(ctx, t - sc.start); ctx.restore(); ctx.globalAlpha = 1;
  const TR = 0.3, cuts = CONFIG.loop ? [0, ...CUTS, DUR] : CUTS;
  for (const b of cuts) { if (t > b - TR && t <= b && b > 0) drawCover(ctx, (t - (b - TR)) / TR); if (t >= b && t < b + TR && b < DUR) drawCover(ctx, 1 - (t - b) / TR); }
}
(() => {
  const L = { play: 'Reproducir', pause: 'Pausa', reset: 'Reiniciar', son: 'Sonido: sí', soff: 'Sonido: no', rec: 'Exportar video', recing: 'Grabando...', saved: 'Descargado' };
  const $ = id => document.getElementById(id), cv = $('cv'), cx = cv.getContext('2d');
  const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bx = buf.getContext('2d');
  document.title = CONFIG.title; $('title').textContent = CONFIG.title; $('reset').textContent = L.reset; $('sound').textContent = L.soff; $('rec').textContent = L.rec;
  cv.width = W * 4; cv.height = H * 4; cv.style.maxWidth = '100%'; cv.style.margin = '0 auto';
  $('scrub').max = DUR;
  let t = 0.35, playing = true, last = null, rec = null, prev = 0;
  const render = () => { drawScene(bx, t); cx.imageSmoothingEnabled = false; cx.drawImage(buf, 0, 0, cv.width, cv.height); $('scrub').value = t; $('time').textContent = t.toFixed(2) + ' / ' + DUR; $('play').textContent = playing ? L.pause : L.play; };
  function loop(now) {
    prev = t;
    if (playing) { const at = Sound.time(); t = at !== null ? at : mod(t + (last === null ? 0 : Math.min(0.1, (now - last) / 1000)), DUR); last = now; } else last = null;
    if (!CONFIG.loop && !rec && t < prev && playing) { t = DUR - 0.01; playing = false; }
    Sound.update(t, playing); render();
    if (rec && t < prev && prev > DUR / 2) rec.stop();
    requestAnimationFrame(loop);
  }
  $('play').onclick = () => { playing = !playing; Sound.resync(); };
  $('reset').onclick = () => { t = 0.35; Sound.resync(); };
  $('scrub').oninput = e => { t = +e.target.value; Sound.resync(); render(); };
  cv.onclick = () => $('play').click();
  $('sound').onclick = async () => { if (Sound.on) Sound.disable(); else await Sound.enable(); $('sound').textContent = Sound.on ? L.son : L.soff; $('sound').classList.toggle('on', Sound.on); };
  $('rec').onclick = async () => {                                     
    if (rec || !window.MediaRecorder) return;
    try { await Sound.enable(); $('sound').textContent = L.son; } catch (err) {}
    const stream = cv.captureStream(30), a = Sound.stream(); if (a) a.getAudioTracks().forEach(tr => stream.addTrack(tr));
    const type = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || ''; 
    const chunks = []; rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 8e6 } : {});
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const blob = new Blob(chunks, { type: rec.mimeType }), ext = rec.mimeType.includes('mp4') ? 'mp4' : 'webm'; const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(blob); aEl.download = 'portafolio-animacion.' + ext; document.body.appendChild(aEl); aEl.click(); aEl.remove(); rec = null; $('msg').textContent = L.saved + ' (' + ext + ')'; };
    t = 0; playing = true; Sound.resync(); rec.start(250); $('msg').textContent = L.recing;
  };
  render(); requestAnimationFrame(loop);
})();
</script>
